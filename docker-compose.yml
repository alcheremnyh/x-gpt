services:
  x-gpt:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      Storage__DataDirectory: /app/data
      Storage__DatabaseFileName: xgpt.db
      Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      Ollama__Model: ${OLLAMA_MODEL:-llama3.1}
    volumes:
      - xgpt_data:/app/data
    restart: unless-stopped

volumes:
  xgpt_data:
